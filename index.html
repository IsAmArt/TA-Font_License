<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Font - รวมผลงานฟอนต์</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; color: #333; line-height: 1.6; background-color: #f4f4f4; }
        header { background-color: #111; color: #fff; padding: 20px 0; position: sticky; top: 0; z-index: 100; text-align: center; }
        nav { display: flex; justify-content: center; gap: 30px; }
        nav a { color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover { color: #ccc; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 40px; }
        
        /* สไตล์ตารางรวมฟอนต์ (Grid) */
        .font-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .font-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none; /* เอาขีดเส้นใต้ลิงก์ออก */
            color: #333;
        }
        .font-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        .font-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .font-card-info {
            padding: 15px;
            text-align: center;
        }
        .font-card-info h3 { margin: 0 0 5px 0; font-size: 1.2em; }
        .font-card-info p { margin: 0; color: #666; font-size: 0.9em; }
        
        footer { background-color: #111; color: #777; text-align: center; padding: 20px 0; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>ผลงานออกแบบ TA Font</h1>
        
        <!-- ส่วนตารางรวมฟอนต์ -->
        <div class="font-grid">
            
            <!-- ฟอนต์ตัวที่ 1 (คลิกแล้วไปหน้า font-1.html) -->
            <a href="TA_GBA_monothai.html" class="font-card">
                <img src="https://1drv.ms/i/c/95ea3aaef6c02923/IQStaEl5AGvARo1CmXsVHhCZAdulgzJ-qVlafXeW3hziI14?height=660" width="660" height="auto"
                <div class="font-card-info">
                    <h3>TA GBA monothai</h3>
                    <p>ฟอนต์ไทยสไตล์พิกเซล</p>
                </div>
            </a>

            <!-- ฟอนต์ตัวที่ 2 (ตัวอย่าง) -->
            <a href="#" class="font-card">
                <img src="cover-font2.jpg" alt="ปกฟอนต์ที่ 2">
                <div class="font-card-info">
                    <h3>TA Tranform</h3>
                    <p>=ชุดฟอนต์ไทย Pixel & HD</p>
                </div>
            </a>

            <!-- คุณสามารถก๊อปปี้ <a href="...">...</a> เพิ่มฟอนต์ตัวอื่นๆ ได้เรื่อยๆ -->
            
        </div>
    </div>

    <!-- ย้าย Contact มารวมไว้หน้าแรกด้านล่างสุดได้ -->
    <div class="container" id="contact" style="text-align: center; margin-top: 40px;">
        <h2>ติดต่อสอบถาม</h2>
        <p>Email: isamart2530@gmail.com | Facebook: TA Font | Line ID: isamarts </p>
    </div>

    <footer>
        &copy; 2026 TA Font. All rights reserved.
    </footer>

</body>
</html>
